/* ── Açılış kilidi (opsiyonel) ──
   Meslek sırrı: telefon başkasının eline geçtiğinde müvekkil adları görünmesin.
   Bu bir şifreleme değil, gündelik bir perdedir; veriyi cihazdan korumaz.      */
async function hashPin(p){
  const s = 'turta:'+p;
  try {
    const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
    return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
  } catch(e){
    let h=0; for (let i=0;i<s.length;i++) h=((h<<5)-h+s.charCodeAt(i))|0;
    return 'f'+(h>>>0).toString(16);
  }
}
function openPin(){
  const has = !!S.settings.pin;
  openSheet(
    sheetHead('🔒 Açılış Kilidi', has?'Kilit açık':'Kapalı') +
    `<div class="sheet-body">
      <div class="hint info">Uygulama açılırken ve arka plandan dönerken PIN sorar.
        Telefonu birine uzattığınızda müvekkil adlarının görünmesini engeller.
        Cihaz şifrelemesinin yerine geçmez.</div>
      ${has?'':`<div class="fld"><label class="lbl">Yeni PIN (4–8 hane)</label>
        <input type="password" class="inp num" id="pn-1" inputmode="numeric" maxlength="8" autocomplete="off"></div>
      <div class="fld"><label class="lbl">Tekrar</label>
        <input type="password" class="inp num" id="pn-2" inputmode="numeric" maxlength="8" autocomplete="off"></div>`}
      ${has?`<div class="fld"><label class="lbl">Mevcut PIN</label>
        <input type="password" class="inp num" id="pn-0" inputmode="numeric" maxlength="8" autocomplete="off"></div>`:''}
    </div>
    <div class="sheet-foot">
      ${has?'<button class="btn btn-dg" id="pn-off">Kilidi Kaldır</button>'
           :'<button class="btn btn-p" id="pn-on">Kilidi Aç</button>'}
      <button class="btn btn-2" data-act="sheet:close">Vazgeç</button>
    </div>`,
  sh=>{
    const on = sh.querySelector('#pn-on');
    if (on) on.onclick = async ()=>{
      const a=sh.querySelector('#pn-1').value.trim(), b=sh.querySelector('#pn-2').value.trim();
      if (!/^\d{4,8}$/.test(a)){ toast('⚠️ PIN 4–8 rakam olmalı'); return; }
      if (a!==b){ toast('⚠️ PIN’ler eşleşmiyor'); return; }
      S.settings.pin = await hashPin(a);
      saveSettings(); closeSheet(); renderSettings(); toast('🔒 Kilit açıldı');
    };
    const off = sh.querySelector('#pn-off');
    if (off) off.onclick = async ()=>{
      const v = sh.querySelector('#pn-0').value.trim();
      if (await hashPin(v) !== S.settings.pin){ toast('⚠️ PIN yanlış'); return; }
      S.settings.pin = null;
      saveSettings(); closeSheet(); renderSettings(); toast('Kilit kaldırıldı');
    };
    return null;
  });
}

let lockedAt = 0;
function showLock(){
  const host=$('#lock'); if (!host) return;
  host.hidden=false;
  const inp=$('#lock-in'); inp.value=''; setTimeout(()=>inp.focus(),120);
}
function hideLock(){ const h=$('#lock'); if(h) h.hidden=true; }
async function tryUnlock(){
  const v = $('#lock-in').value.trim();
  if (await hashPin(v) === S.settings.pin){
    hideLock(); $('#lock-msg').textContent=''; buzz();
    setTimeout(maybePrompt, 500);
  }
  else { $('#lock-msg').textContent='PIN yanlış'; $('#lock-in').value=''; buzz(60); }
}

/** Açılışta tek bir panel gösterir — ikisi birden üst üste binmesin. */
let promptShown = false;
function maybePrompt(){
  if (promptShown) return;
  if (!$('#sheet-host').hidden) return;      // kullanıcı zaten bir şey açmış
  if (!S.hearings.length) return;            // boş uygulamada rahatsız etme
  promptShown = true;
  if (!S.settings.warnSeen) { openFirstRunWarning(); return; }
  const d = shouldPromptBackup();
  if (d) openBackupPrompt(d);
}

document.addEventListener('click', e=>{
  const el = e.target.closest('[data-act]');
  if (el && ACTIONS[el.dataset.act]) {
    e.preventDefault();
    ACTIONS[el.dataset.act](el, e);
    return;
  }
  const nav = e.target.closest('[data-nav]');
  if (nav) { showPage(nav.dataset.nav); return; }
  const seg = e.target.closest('[data-seg]');
  if (seg) { setSeg(seg.dataset.seg); return; }
  const chip = e.target.closest('[data-f]');
  if (chip && chip.classList.contains('chip')) {
    S.filter = chip.dataset.f; renderSeg(); renderAgenda(); return;
  }
});

// Arama girişleri
$('#q').addEventListener('input', e=>{ S.q=e.target.value; renderSeg(); renderAgenda(); });
$('#qf').addEventListener('input', e=>{ S.qf=e.target.value; renderFiles(); });

// Geri tuşu sheet'i kapatsın (Android donanım tuşu / jest)
window.addEventListener('popstate', ()=>{
  if (!$('#sheet-host').hidden) { closeSheet(); history.pushState(null,''); }
});
document.addEventListener('keydown', e=>{
  if (e.key==='Escape' && !$('#sheet-host').hidden) closeSheet();
});

// ═══════════════ 15. PWA ═══════════════
window.addEventListener('beforeinstallprompt', e=>{
  e.preventDefault();
  S.deferredInstall = e;
  if (S.page==='settings') renderSettings();
});
window.addEventListener('appinstalled', ()=>{
  S.deferredInstall=null;
  toast('🎉 Uygulama ana ekrana kuruldu');
  if (S.page==='settings') renderSettings();
});
async function doInstall(){
  if (S.deferredInstall){
    S.deferredInstall.prompt();
    try { await S.deferredInstall.userChoice; } catch(e){}
    S.deferredInstall=null;
    return;
  }
  const ua = navigator.userAgent;
  const isIOS = /iPhone|iPad|iPod/.test(ua);
  await confirmSheet({
    title:'Ana Ekrana Kur', ok:'Anladım',
    body: isIOS
      ? `Safari'de <b>Paylaş</b> (⬆️) düğmesine dokunun →
         <b>“Ana Ekrana Ekle”</b> → <b>Ekle</b>.`
      : `Chrome'da sağ üstteki <b>⋮</b> menüsüne dokunun →
         <b>“Uygulamayı yükle”</b> veya <b>“Ana ekrana ekle”</b>.<br><br>
         Bu seçenek görünmüyorsa sayfayı bir kez yenileyip tekrar deneyin.`
  });
}
function applyUpdate(){
  if (S.swUpdate && S.swUpdate.waiting) S.swUpdate.waiting.postMessage({type:'SKIP_WAITING'});
  setTimeout(()=>location.reload(), 300);
}
function registerSW(){
  if (!('serviceWorker' in navigator)) return;
  if (location.protocol!=='https:' && location.hostname!=='localhost') return;
  navigator.serviceWorker.register('sw.js').then(reg=>{
    if (reg.waiting){ S.swUpdate=reg; renderBanners(); }
    reg.addEventListener('updatefound', ()=>{
      const nw = reg.installing;
      if (!nw) return;
      nw.addEventListener('statechange', ()=>{
        if (nw.state==='installed' && navigator.serviceWorker.controller){
          S.swUpdate=reg; renderBanners();
        }
      });
    });
  }).catch(err=>console.warn('[sw] kayıt başarısız', err));

  let reloaded=false;
  navigator.serviceWorker.addEventListener('controllerchange', ()=>{
    if (reloaded) return; reloaded=true; location.reload();
  });
}

// ═══════════════ 16. BAŞLANGIÇ ═══════════════
function boot(){
  loadAll();
  applyTheme(S.settings.theme);
  const n=new Date(); S.calY=n.getFullYear(); S.calM=n.getMonth();

  showPage('agenda');
  renderAll();

  registerSW();
  requestPersist();
  recoverIfEmpty();

  history.pushState(null,'');           // geri tuşu için tampon
  setInterval(notifyTick, 60000); notifyTick();

  // Açılış kilidi
  if (S.settings.pin) showLock();
  $('#lock-go').onclick = tryUnlock;
  $('#lock-in').addEventListener('keydown', e=>{ if(e.key==='Enter') tryUnlock(); });

  // Açılış uyarıları: önce "veri nerede durur", sonra yedek zamanı
  if (!S.settings.pin) setTimeout(maybePrompt, 700);

  // Gün değişince yeniden çiz (gece yarısını geçen oturumlar)
  let lastDay = todayISO();
  setInterval(()=>{ const d=todayISO(); if(d!==lastDay){ lastDay=d; renderAll(); } }, 60000);
  document.addEventListener('visibilitychange', ()=>{
    if (document.hidden) { lockedAt = Date.now(); return; }
    renderAll();
    // 2 dakikadan uzun süre arka planda kaldıysa yeniden kilitle
    if (S.settings.pin && lockedAt && Date.now()-lockedAt > 120000) showLock();
  });

  // Kısayollar: ?a=new / ?a=today
  const a = new URLSearchParams(location.search).get('a');
  if (a==='new')   setTimeout(()=>openForm('new'), 150);
  if (a==='today') setSeg('today');
  if (a) history.replaceState(null,'',location.pathname);
}

if (document.readyState==='loading') document.addEventListener('DOMContentLoaded', boot);
else boot();
