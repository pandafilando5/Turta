<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Turta — Duruşma Takip</title>

<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#654321">
<meta name="color-scheme" content="light dark">
<meta name="description" content="Duruşma, dosya ve takvim takibi. Çevrimdışı çalışır.">

<link rel="icon" href="icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Turta">

<style>
/* ============================================================
   1. TEMA DEĞİŞKENLERİ
   ============================================================ */
:root{
  --primary:#8b5a2b; --primary-light:#a0522d; --primary-dark:#654321;
  --accent:#d4a574;
  --success:#2e7d32; --warning:#ef6c00; --danger:#c62828; --info:#1565c0;
  --bg:#faf6f0; --surface:#ffffff; --surface-2:#f4ece1;
  --text:#33210f; --text-2:#6b4423; --text-3:#9a8069;
  --border:#e8dcc8; --shadow:rgba(90,60,25,.13);
  --on-primary:#ffffff;

  --t-ana:#d32f2f; --t-ek:#1565c0; --t-tev:#ef6c00; --t-fuat:#2e7d32;
  --st-active:#2e7d32; --st-done:#1565c0; --st-decided:#6a1b9a; --st-postponed:#ef6c00;

  --r-s:8px; --r-m:14px; --r-l:20px; --r-xl:26px;
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-t:env(safe-area-inset-top,0px);
  --navh:60px;
}
[data-theme="night"]{
  --primary:#3b6ea5; --primary-light:#4e86c4; --primary-dark:#1b3a5c;
  --accent:#7fb6ea;
  --bg:#0c1420; --surface:#16212f; --surface-2:#1e2b3c;
  --text:#e7edf4; --text-2:#a9b8c9; --text-3:#71829a;
  --border:#27364a; --shadow:rgba(0,0,0,.45);
  --t-ana:#ef5350; --t-ek:#42a5f5; --t-tev:#ffa726; --t-fuat:#66bb6a;
  --st-active:#66bb6a; --st-done:#42a5f5; --st-decided:#ba68c8; --st-postponed:#ffa726;
  --success:#66bb6a; --warning:#ffa726; --danger:#ef5350; --info:#42a5f5;
}
[data-theme="nature"]{
  --primary:#2d5a27; --primary-light:#3d7a37; --primary-dark:#1c3a17;
  --accent:#8bc34a;
  --bg:#eef6ec; --surface:#ffffff; --surface-2:#e2efdf;
  --text:#173313; --text-2:#3b5c35; --text-3:#7d9877;
  --border:#cfe4cb; --shadow:rgba(30,70,25,.14);
}
[data-theme="bordeaux"]{
  --primary:#7b3138; --primary-light:#95404a; --primary-dark:#4e1f24;
  --accent:#c9a227;
  --bg:#fbf3f2; --surface:#ffffff; --surface-2:#f3e4e2;
  --text:#37191c; --text-2:#6b4145; --text-3:#a07d81;
  --border:#ecd6d3; --shadow:rgba(100,40,45,.14);
}
[data-theme="ocean"]{
  --primary:#0a6b91; --primary-light:#0d84b0; --primary-dark:#054961;
  --accent:#26c6da;
  --bg:#eaf6fa; --surface:#ffffff; --surface-2:#d9eef5;
  --text:#08333f; --text-2:#1c5a6c; --text-3:#6ba0b0;
  --border:#c3e3ee; --shadow:rgba(10,80,110,.14);
}

/* ============================================================
   2. TEMEL
   ============================================================ */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  background:var(--bg); color:var(--text);
  font-size:15px; line-height:1.45;
  min-height:100dvh;
  padding-bottom:calc(var(--navh) + var(--safe-b));
  overscroll-behavior-y:contain;
  -webkit-user-select:none; user-select:none;
}
/* Metin seçilebilir olmalı: mahkeme adı / esas no kopyalanır */
.sel,.sel *{-webkit-user-select:text;user-select:text}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none;padding:0}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.hide{display:none !important}
[hidden]{display:none !important}

/* ============================================================
   3. ÜST BAR
   ============================================================ */
.appbar{
  position:sticky; top:0; z-index:120;
  background:linear-gradient(135deg,var(--primary-dark),var(--primary-light));
  color:#fff;
  padding:calc(var(--safe-t) + 9px) 12px 9px;
  display:flex; align-items:center; gap:8px;
  box-shadow:0 2px 12px var(--shadow);
}
.brand{display:flex;align-items:center;gap:7px;font-weight:700;font-size:15px;min-width:0}
.brand-sub{font-size:11px;opacity:.82;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spacer{flex:1}
.ab-btn{
  color:#fff;background:rgba(255,255,255,.18);
  border-radius:999px;padding:7px 12px;font-size:13px;font-weight:600;
  min-height:36px;display:flex;align-items:center;gap:5px;
}
.ab-btn:active{background:rgba(255,255,255,.32)}
.ab-badge{
  background:rgba(255,255,255,.22);border-radius:999px;
  padding:5px 10px;font-size:12px;font-weight:700;white-space:nowrap;
}

/* Arama çubuğu */
.searchbar{
  position:sticky;top:0;z-index:119;
  background:var(--surface);border-bottom:1px solid var(--border);
  padding:8px 12px;display:flex;gap:8px;align-items:center;
}
.searchbar input{
  flex:1;padding:11px 14px;border:2px solid var(--border);border-radius:999px;
  background:var(--bg);font-size:15px;-webkit-user-select:text;user-select:text;
}
.searchbar input:focus{outline:none;border-color:var(--primary)}

/* Güncelleme / uyarı şeridi */
.banner{
  display:flex;align-items:center;gap:10px;
  padding:10px 14px;font-size:13px;font-weight:600;
  background:var(--info);color:#fff;
}
.banner.warn{background:var(--warning)}
.banner.bad{background:var(--danger)}
.banner button{
  margin-left:auto;background:rgba(255,255,255,.25);color:#fff;
  padding:6px 12px;border-radius:999px;font-size:12px;font-weight:700;
}

/* ============================================================
   4. SEGMENT BAR
   ============================================================ */
.segbar{
  position:sticky;top:0;z-index:100;
  display:flex;gap:6px;padding:9px 10px;
  background:var(--surface);border-bottom:1px solid var(--border);
  overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;
}
.segbar::-webkit-scrollbar{display:none}
.seg{
  flex-shrink:0;padding:8px 15px;border-radius:999px;
  background:var(--bg);border:1.5px solid var(--border);
  color:var(--text-2);font-size:13px;font-weight:600;min-height:38px;
  transition:background .18s,color .18s,border-color .18s;
}
.seg.on{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}

.chipbar{
  display:flex;gap:6px;padding:8px 10px;
  background:var(--surface);border-bottom:1px solid var(--border);
  overflow-x:auto;scrollbar-width:none;
}
.chipbar::-webkit-scrollbar{display:none}
.chip{
  flex-shrink:0;padding:6px 13px;border-radius:999px;
  border:1.5px solid var(--border);background:var(--bg);
  color:var(--text-3);font-size:12px;font-weight:600;min-height:34px;
}
.chip.on{color:#fff;border-color:transparent}
.chip.on[data-f="all"]{background:var(--primary)}
.chip.on[data-f="active"]{background:var(--st-active)}
.chip.on[data-f="done"]{background:var(--st-done)}
.chip.on[data-f="decided"]{background:var(--st-decided)}
.chip.on[data-f="postponed"]{background:var(--st-postponed)}

/* ============================================================
   5. AJANDA LİSTESİ
   ============================================================ */
.page{display:none}
.page.on{display:block}
.list{padding:10px 10px 26px}

.daysep{
  display:flex;align-items:baseline;gap:8px;
  padding:16px 4px 8px;
}
.daysep:first-child{padding-top:6px}
.daysep-main{font-size:14px;font-weight:800;color:var(--text)}
.daysep-sub{font-size:11.5px;color:var(--text-3);font-weight:600}
.daysep-count{margin-left:auto;font-size:11px;color:var(--text-3);font-weight:700}
.daysep.is-today .daysep-main{color:var(--primary)}
.daysep.is-off .daysep-sub{color:var(--warning)}

.hrow{
  position:relative;background:var(--surface);
  border-radius:var(--r-m);margin-bottom:8px;
  box-shadow:0 1px 6px var(--shadow);
  overflow:hidden;
}
.hrow-in{
  display:flex;gap:11px;padding:11px 12px 11px 13px;
  border-left:5px solid var(--border);
  background:var(--surface);
  will-change:transform;touch-action:pan-y;
  align-items:flex-start;
}
.hrow-in.t-ana{border-left-color:var(--t-ana)}
.hrow-in.t-ek{border-left-color:var(--t-ek)}
.hrow-in.t-tev{border-left-color:var(--t-tev)}
.hrow-in.t-fuat{border-left-color:var(--t-fuat)}
.hrow.s-done .hrow-in,.hrow.s-decided .hrow-in{opacity:.62}
.hrow.s-postponed .hrow-in{opacity:.75}

.h-time{
  min-width:52px;font-size:17px;font-weight:800;
  font-variant-numeric:tabular-nums;letter-spacing:-.3px;padding-top:1px;
}
.h-body{flex:1;min-width:0}
.h-court{font-size:14.5px;font-weight:650;line-height:1.3;word-break:break-word}
.h-meta{
  display:flex;flex-wrap:wrap;gap:4px 8px;
  font-size:11.5px;color:var(--text-3);margin-top:3px;
}
.h-file{font-weight:700;color:var(--text-2)}
.h-note{
  font-size:12px;color:var(--text-2);background:var(--surface-2);
  padding:5px 8px;border-radius:var(--r-s);margin-top:6px;
  border-left:3px solid var(--border);word-break:break-word;
}
.h-tail{display:flex;flex-direction:column;align-items:flex-end;gap:5px;flex-shrink:0}
.pill{
  padding:2px 8px;border-radius:999px;font-size:10px;font-weight:800;
  white-space:nowrap;letter-spacing:.2px;
}
.pill-today{background:#ffebee;color:#c62828}
.pill-tom{background:#e3f2fd;color:#1565c0}
.pill-soon{background:#fff8e1;color:#e65100}
.pill-past{background:var(--surface-2);color:var(--text-3)}
[data-theme="night"] .pill-today{background:#4a1f1f;color:#ff8a80}
[data-theme="night"] .pill-tom{background:#16344d;color:#82b1ff}
[data-theme="night"] .pill-soon{background:#4a3a17;color:#ffcc80}
.stdot{width:9px;height:9px;border-radius:50%}
.stdot.active{background:var(--st-active)}
.stdot.done{background:var(--st-done)}
.stdot.decided{background:var(--st-decided)}
.stdot.postponed{background:var(--st-postponed)}

/* Kaydırma arka planı */
.swipe-bg{position:absolute;inset:0;display:flex;align-items:center;justify-content:space-between;padding:0 20px;font-size:13px;font-weight:800;color:#fff}
.swipe-bg .sw-l{opacity:0}
.swipe-bg .sw-r{opacity:0}
.swipe-bg{background:linear-gradient(90deg,var(--st-done) 50%,var(--st-postponed) 50%)}

/* İşaret bekleyen geçmiş duruşmalar */
.stale{
  background:var(--surface);border-radius:var(--r-m);
  border:1.5px solid var(--warning);margin-bottom:14px;overflow:hidden;
  box-shadow:0 1px 6px var(--shadow);
}
.stale-h{
  display:flex;align-items:center;gap:8px;padding:11px 13px;
  background:rgba(239,108,0,.10);font-size:12.5px;font-weight:800;color:var(--warning);
}
.stale-h span{margin-left:auto;font-weight:700;opacity:.85}
.stale-r{padding:10px 13px;border-top:1px solid var(--border)}
.stale-top{display:flex;gap:10px;align-items:baseline}
.stale-d{font-size:12px;font-weight:800;color:var(--text-2);white-space:nowrap;font-variant-numeric:tabular-nums}
.stale-c{flex:1;min-width:0;font-size:13.5px;font-weight:600;line-height:1.35;word-break:break-word}
.stale-f{font-size:11px;color:var(--text-3);margin-top:2px}
.stale-b{display:flex;gap:6px;margin-top:8px}
.stale-b button{
  flex:1;padding:9px 4px;border-radius:9px;font-size:12px;font-weight:800;
  background:var(--surface-2);color:var(--text-2);
}
.stale-b button:active{opacity:.75}
.stale-b .b-done{background:var(--st-done);color:#fff}
.stale-b .b-post{background:var(--st-postponed);color:#fff}
.stale-b .b-dec{background:var(--st-decided);color:#fff}

/* 14 günlük yoğunluk şeridi */
.strip{
  display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;
  padding:2px 2px 12px;-webkit-overflow-scrolling:touch;
}
.strip::-webkit-scrollbar{display:none}
.sd{
  flex:0 0 46px;border-radius:11px;background:var(--surface);
  box-shadow:0 1px 4px var(--shadow);padding:7px 3px 6px;
  display:flex;flex-direction:column;align-items:center;gap:2px;
  border:1.5px solid transparent;
}
.sd-w{font-size:9.5px;font-weight:800;color:var(--text-3);letter-spacing:.3px}
.sd-n{font-size:15px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.sd-dots{display:flex;gap:2px;height:6px;margin-top:1px}
.sd-dots i{width:5px;height:5px;border-radius:50%;display:block}
.sd.today{border-color:var(--primary);background:var(--surface-2)}
.sd.today .sd-n{color:var(--primary)}
.sd.off .sd-w,.sd.off .sd-n{color:var(--warning)}
.sd.empty0 .sd-n{opacity:.35}

/* Boş durum */
.empty{text-align:center;padding:44px 22px;color:var(--text-3)}
.empty-ico{font-size:40px;margin-bottom:10px;opacity:.6}
.empty-t{font-size:15px;font-weight:700;color:var(--text-2);margin-bottom:5px}
.empty-d{font-size:13px;line-height:1.5}

/* Hoş geldin kartı */
.welcome{
  margin:12px 10px;padding:16px;border-radius:var(--r-l);
  background:linear-gradient(135deg,var(--primary-dark),var(--primary-light));
  color:#fff;box-shadow:0 4px 18px var(--shadow);
}
.welcome h2{margin:0 0 6px;font-size:17px}
.welcome p{margin:0 0 13px;font-size:13px;opacity:.92;line-height:1.5}
.welcome .wbtn{
  display:block;width:100%;padding:13px;border-radius:var(--r-m);
  background:#fff;color:var(--primary-dark);font-weight:800;font-size:14px;margin-bottom:8px;
}
.welcome .wbtn.ghost{background:rgba(255,255,255,.16);color:#fff;border:1.5px solid rgba(255,255,255,.45)}

/* ============================================================
   6. TAKVİM
   ============================================================ */
.calwrap{background:var(--surface);border-bottom:1px solid var(--border);padding:6px 8px 10px}
.calnav{display:flex;align-items:center;justify-content:center;gap:6px;padding:6px 2px 10px}
.calnav-btn{
  width:40px;height:40px;border-radius:50%;background:var(--bg);
  display:flex;align-items:center;justify-content:center;
  font-size:20px;font-weight:700;color:var(--text-2);
}
.calnav-btn:active{background:var(--border)}
.calnav-title{flex:1;text-align:center;font-size:15px;font-weight:800}
.calnav-today{
  padding:7px 13px;border-radius:999px;background:var(--primary);
  color:var(--on-primary);font-size:12px;font-weight:700;
}
.wk{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:10.5px;color:var(--text-3);font-weight:800;margin-bottom:5px}
.wk div:nth-child(n+6){color:var(--warning)}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;touch-action:pan-y}
.cell{
  aspect-ratio:1;min-height:42px;border-radius:10px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-size:13.5px;font-weight:600;color:var(--text);
  background:transparent;position:relative;
}
.cell.mute{color:var(--text-3);opacity:.45}
.cell.off{color:var(--warning)}
.cell.today{background:var(--accent);color:#3a2510;font-weight:800}
.cell.on{background:var(--primary);color:var(--on-primary);font-weight:800}
.cell.on .cdot{box-shadow:0 0 0 1.5px rgba(255,255,255,.9)}
.cdots{display:flex;gap:2.5px;margin-top:3px;height:6px}
.cdot{width:5.5px;height:5.5px;border-radius:50%}
.cdot.ana{background:var(--t-ana)}.cdot.ek{background:var(--t-ek)}
.cdot.tev{background:var(--t-tev)}.cdot.fuat{background:var(--t-fuat)}
.legend{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;padding:10px 6px 2px;font-size:10.5px;color:var(--text-3)}
.legend span{display:flex;align-items:center;gap:4px;font-weight:600}
.legend i{width:9px;height:9px;border-radius:50%;display:block}

/* ============================================================
   7. DOSYALAR
   ============================================================ */
.fgroup{
  background:var(--surface);border-radius:var(--r-m);
  margin-bottom:9px;box-shadow:0 1px 6px var(--shadow);overflow:hidden;
}
.fg-head{display:flex;align-items:center;gap:10px;padding:13px;width:100%;text-align:left}
.fg-head:active{background:var(--surface-2)}
.fg-main{flex:1;min-width:0}
.fg-no{font-weight:800;font-size:14.5px;color:var(--primary);font-variant-numeric:tabular-nums}
.fg-sub{font-size:11.5px;color:var(--text-3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fg-right{display:flex;align-items:center;gap:9px;flex-shrink:0}
.fg-next{
  text-align:right;font-size:11px;font-weight:700;color:var(--text-2);line-height:1.3;
}
.fg-next b{display:block;font-size:12.5px;color:var(--primary)}

/* ============================================================
   8. ÖZET
   ============================================================ */
.stats{padding:12px 10px 26px}
.sgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-bottom:12px}
.scard{
  background:var(--surface);padding:14px 12px;border-radius:var(--r-m);
  box-shadow:0 1px 6px var(--shadow);border-left:4px solid var(--border);
}
.scard b{display:block;font-size:25px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
.scard span{display:block;font-size:11.5px;color:var(--text-3);margin-top:3px;font-weight:600}
.panel{
  background:var(--surface);border-radius:var(--r-m);padding:14px;
  box-shadow:0 1px 6px var(--shadow);margin-bottom:12px;
}
.panel-t{font-weight:800;font-size:13.5px;margin-bottom:10px;display:flex;align-items:center;gap:7px}
.panel.alert{background:#fff4e5;border-left:4px solid var(--warning)}
[data-theme="night"] .panel.alert{background:#3a2a12}
.prow{
  display:flex;justify-content:space-between;align-items:center;gap:10px;
  padding:9px 10px;background:var(--bg);border-radius:var(--r-s);margin-bottom:7px;font-size:12.5px;
}
.prow:last-child{margin-bottom:0}
.prow b{font-weight:800;white-space:nowrap}
.bar{height:7px;border-radius:4px;background:var(--border);overflow:hidden;margin-top:5px}
.bar i{display:block;height:100%;border-radius:4px}

/* ============================================================
   9. AYARLAR
   ============================================================ */
.settings{padding:12px 10px 26px}
.sect{background:var(--surface);border-radius:var(--r-m);margin-bottom:13px;overflow:hidden;box-shadow:0 1px 6px var(--shadow)}
.sect-t{padding:11px 14px;font-weight:800;font-size:12.5px;background:var(--surface-2);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:7px;letter-spacing:.2px}
.item{display:flex;align-items:center;gap:12px;padding:13px 14px;border-bottom:1px solid var(--border);width:100%;text-align:left}
.item:last-child{border-bottom:none}
.item:active{background:var(--surface-2)}
.item-main{flex:1;min-width:0}
.item-l{font-size:14.5px;font-weight:600}
.item-d{font-size:11.5px;color:var(--text-3);margin-top:2px;line-height:1.4}
.item-v{font-size:13px;color:var(--text-3);flex-shrink:0;font-weight:600}
.item.danger .item-l{color:var(--danger)}
.toggle{width:48px;height:28px;border-radius:999px;background:var(--border);position:relative;flex-shrink:0;transition:background .22s}
.toggle.on{background:var(--success)}
.toggle::after{content:'';position:absolute;width:22px;height:22px;border-radius:50%;background:#fff;top:3px;left:3px;transition:transform .22s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.toggle.on::after{transform:translateX(20px)}
.themes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:14px}
.th{
  aspect-ratio:1.5;border-radius:var(--r-m);border:3px solid transparent;
  display:flex;align-items:flex-end;justify-content:center;padding-bottom:6px;
  font-size:11px;font-weight:800;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.55);
}

/* ════════════════════════════════════════════════════════════

};
const MONTHS = ['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];
const MONTHS_S = ['Oca','Şub','Mar','Nis','May','Haz','Tem','Ağu','Eyl','Eki','Kas','Ara'];

/* Konum etiketleri — değiştirmek isterseniz tek yer burası. */

/* 2429 s. Kanun'a göre sabit tarihli ulusal bayram / genel tatiller.
   Dinî bayramlar her yıl kaydığı için buraya konmaz — Ayarlar'dan elle eklenir. */
const FIXED_HOLIDAYS = {
  '01-01':'Yılbaşı',
  '04-23':'Ulusal Egemenlik ve Çocuk Bayramı',

const S = {

// ═══════════════ 1. YARDIMCILAR ═══════════════

function esc(s){
  return String(s==null?'':s).replace(/[&<>"']/g,c=>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* Türkçe arama katlaması: "İstanbul"→"istanbul", "Şişli"→"sisli" */
function fold(s){
  return String(s==null?'':s)
    .replace(/İ/g,'i').replace(/I/g,'ı').replace(/Ş/g,'ş').replace(/Ğ/g,'ğ')
    .replace(/Ü/g,'ü').replace(/Ö/g,'ö').replace(/Ç/g,'ç')
    .toLowerCase()
    .replace(/ı/g,'i').replace(/ş/g,'s').replace(/ğ/g,'g')
    .replace(/ü/g,'u').replace(/ö/g,'o').replace(/ç/g,'c')
    .replace(/â/g,'a').replace(/î/g,'i').replace(/û/g,'u');
}

/** Panoya kopyala (mobil güvenli, geri düşüşlü). */
async function copyText(t, msg){
  try { await navigator.clipboard.writeText(t); toast(msg||'📋 Kopyalandı'); return; }
  catch(e){}
  const ta=document.createElement('textarea');
  ta.value=t; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); toast(msg||'📋 Kopyalandı'); }
  catch(_){ toast('Kopyalanamadı'); }
  document.body.removeChild(ta);

// ── Tarih (her zaman YEREL — UTC kayması yok) ──
function parseD(iso){
  const p = String(iso||'').split('-');
  return new Date(+p[0], (+p[1]||1)-1, +p[2]||1);
}
function toISO(d){ return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function todayISO(){ return toISO(new Date()); }
function addDays(iso,n){ const d=parseD(iso); d.setDate(d.getDate()+n); return toISO(d); }
function addMonths(iso,n){
  const d=parseD(iso), day=d.getDate();
  d.setDate(1); d.setMonth(d.getMonth()+n);
  const last = new Date(d.getFullYear(), d.getMonth()+1, 0).getDate();
  d.setDate(Math.min(day,last));
  return toISO(d);
}
function dayDiff(a,b){ return Math.round((parseD(a)-parseD(b))/864e5); }
function fmtLong(iso){
  const d=parseD(iso);
  return `${d.getDate()} ${MONTHS[d.getMonth()]} ${d.getFullYear()} ${DAYS_L[d.getDay()]}`;
}
function fmtShort(iso){
  const d=parseD(iso);
  return `${d.getDate()} ${MONTHS_S[d.getMonth()]} ${DAYS_S[d.getDay()]}`;
}
function fmtNum(iso){
  const d=parseD(iso);
  return `${pad(d.getDate())}.${pad(d.getMonth()+1)}.${d.getFullYear()}`;
}
function relLabel(iso){
  const n = dayDiff(iso, todayISO());
  if (n===0)  return ['BUGÜN','pill-today'];
  if (n===1)  return ['YARIN','pill-tom'];
  if (n===-1) return ['DÜN','pill-past'];
  if (n>1 && n<=14)  return [n+' gün','pill-soon'];
  if (n<0)    return [Math.abs(n)+' gün önce','pill-past'];
  return ['',''];
}

// ── Çalışılmayan gün mantığı ──
function isWeekend(iso){ const g=parseD(iso).getDay(); return g===0||g===6; }
function holidayName(iso){
  const mmdd = iso.slice(5);
  if (FIXED_HOLIDAYS[mmdd]) return FIXED_HOLIDAYS[mmdd];
  if ((S.settings.offDays||[]).includes(iso)) return 'Tatil';
  return null;
}
function inAdliTatil(iso){
  const a = S.settings.adliTatil || DEFAULT_SETTINGS.adliTatil;
  if (!a.on) return false;
  const mmdd = iso.slice(5);
  return a.start <= a.end ? (mmdd >= a.start && mmdd <= a.end)
                          : (mmdd >= a.start || mmdd <= a.end);
}
/** Gün hakkında uyarı listesi döndürür. */
function dayFlags(iso){
  const out=[];
  if (isWeekend(iso)) out.push({k:'weekend', t:DAYS_L[parseD(iso).getDay()]+' — hafta sonu'});
  const h = holidayName(iso);
  if (h) out.push({k:'holiday', t:h});
  if (inAdliTatil(iso)) {
    const a=S.settings.adliTatil;
    out.push({k:'adli', t:`Adli tatil dönemi (${a.start.replace('-','.')}–${a.end.replace('-','.')})`});
  }
  return out;
}
function isOffDay(iso){ return isWeekend(iso) || !!holidayName(iso); }
function nextWorkday(iso){
  let d=iso, guard=0;
  while (isOffDay(d) && guard++<400) d = addDays(d,1);
  return d;
}
/** Verilen tarihten sonraki ilk adli tatil bitişini izleyen iş günü. */
function afterAdliTatil(fromISO){
  const a = S.settings.adliTatil || DEFAULT_SETTINGS.adliTatil;
  const y = parseD(fromISO).getFullYear();
  let cand = addDays(`${y}-${a.end}`, 1);
  if (cand <= fromISO) cand = addDays(`${y+1}-${a.end}`, 1);
  return nextWorkday(cand);
}

// ── Depolama ──
function lsGet(key,fallback){
  try { const v=localStorage.getItem(key); return v?JSON.parse(v):fallback; }
  catch(e){ console.warn('lsGet',key,e); return fallback; }
}
function lsSet(key,val){
  try { localStorage.setItem(key,JSON.stringify(val)); return true; }
  catch(e){ console.error('lsSet',key,e); return false; }
}

let _db=null;
function db(){
  if (_db) return _db;
  _db = new Promise((res,rej)=>{
    if (!('indexedDB' in window)) return rej(new Error('IndexedDB yok'));
    const r = indexedDB.open('TurtaDB',1);
    r.onupgradeneeded = e => {
      const d = e.target.result;
      if (!d.objectStoreNames.contains('kv'))   d.createObjectStore('kv',{keyPath:'k'});
      if (!d.objectStoreNames.contains('snaps'))d.createObjectStore('snaps',{keyPath:'d'});
    };
    r.onsuccess = ()=>res(r.result);
    r.onerror   = ()=>rej(r.error);
  });
  return _db;
}
function idbPut(store,obj){
  return db().then(d=>new Promise((res,rej)=>{
    const tx=d.transaction(store,'readwrite');
    tx.objectStore(store).put(obj);
    tx.oncomplete=()=>res(); tx.onerror=()=>rej(tx.error);
  }));
}
function idbGet(store,key){
  return db().then(d=>new Promise((res,rej)=>{
    const r=d.transaction(store,'readonly').objectStore(store).get(key);
    r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error);
  }));
}
function idbAll(store){
  return db().then(d=>new Promise((res,rej)=>{
    const r=d.transaction(store,'readonly').objectStore(store).getAll();
    r.onsuccess=()=>res(r.result||[]); r.onerror=()=>rej(r.error);
  }));
}
function idbDel(store,key){
  return db().then(d=>new Promise((res,rej)=>{
    const tx=d.transaction(store,'readwrite');
    tx.objectStore(store).delete(key);
    tx.oncomplete=()=>res(); tx.onerror=()=>rej(tx.error);
  }));
}

/** Kalıcı depolama izni iste — tarayıcı yer açmak için veriyi silmesin. */
async function requestPersist(){
  try {
    if (navigator.storage && navigator.storage.persist) {
      const already = await navigator.storage.persisted();
      if (!already) await navigator.storage.persist();
    }
  } catch(e){ /* önemsiz */ }
}

// ═══════════════ 2. VERİ MODELİ ═══════════════
/* Dışarıdan gelen dosyalarda alan adları Türkçe olabilir (UYAP dökümü,
   eski üretici betikler). İçe aktarma bunları sessizce eşler. */
const ALIASES = {
  date:['date','tarih','durusmaTarihi','duruşmaTarihi','gun','gün'],
  time:['time','saat','durusmaSaati','duruşmaSaati'],
  court:['court','mahkeme','mahkemeAdi','mahkemeAdı','birim'],
  file:['file','dosya','dosyaNo','esas','esasNo','dosyaNumarasi','dosyaNumarası'],
  client:['client','muvekkil','müvekkil','taraf','taraflar','muvekkilAdi','müvekkilAdı'],
  note:['note','not','aciklama','açıklama','islem','işlem','araKarar'],
  type:['type','tip','bina','konum'],
  status:['status','durum']
};
const TYPE_ALIASES = {
  ana:['ana','anabina','ana bina','merkez'],
  ek:['ek','ekbina','ek bina','ek hizmet'],
  tev:['tev','tevkil','sehirdisi','şehirdışı','sehir disi','şehir dışı','disari','dışarı'],
  fuat:['fuat','ofis']
};
const STATUS_ALIASES = {
  active:['active','aktif','acik','açık','yuruyor','yürüyor','bekliyor'],
  done:['done','tamamlandi','tamamlandı','bitti','oldu','yapildi','yapıldı'],
  decided:['decided','karar','kararverildi','karar verildi','kesinlesti','kesinleşti'],
  postponed:['postponed','ertelendi','erteleme','birakildi','bırakıldı']
};
function pickAlias(h, keys){
  for (const k of keys) if (h[k]!=null && String(h[k]).trim()!=='') return h[k];
  return '';
}
function mapAlias(val, table, fallback){
  const f = fold(val);
  for (const [k,list] of Object.entries(table)) if (list.some(x=>fold(x)===f)) return k;
  return fallback;
}

function normalize(raw){
  // Türkçe/eski alan adlarını çevir
  const h = {...raw};
  for (const [canon, keys] of Object.entries(ALIASES)) {
    if (h[canon]==null || String(h[canon]).trim()==='') {
      const v = pickAlias(raw, keys);
      if (v!=='') h[canon] = v;
    }
  }
  if (h.type   && !TYPES[h.type])    h.type   = mapAlias(h.type, TYPE_ALIASES, 'ana');
  if (h.status && !STATUS[h.status]) h.status = mapAlias(h.status, STATUS_ALIASES, 'active');
  h.date = normDate(h.date);

  const o = {
    id:        String(h.id || uid()),
    date:      String(h.date||'').slice(0,10),
    time:      normTime(h.time),
    court:     String(h.court||'').trim(),
    file:      String(h.file||'').trim(),
    client:    String(h.client||'').trim(),
    type:      TYPES[h.type] ? h.type : 'ana',
    status:    STATUS[h.status] ? h.status : 'active',
    note:      String(h.note||'').trim(),
    prevId:    h.prevId ? String(h.prevId) : null,
    createdAt: +h.createdAt || Date.now(),
    updatedAt: +h.updatedAt || Date.now()
  };
  if (!/^\d{4}-\d{2}-\d{2}$/.test(o.date)) o.date = todayISO();
  return o;
}
function normTime(t){
  const m = String(t||'').match(/(\d{1,2})[:.](\d{1,2})/);
  if (!m) return '09:00';
  const h = Math.min(23, Math.max(0, +m[1]));
  const mi = Math.min(59, Math.max(0, +m[2]));
  return pad(h)+':'+pad(mi);
}
/** 'YYYY-MM-DD' | '15.10.2026' | '15/10/2026' | ISO damgası → 'YYYY-MM-DD' */
function normDate(v){
  const s = String(v==null?'':v).trim();
  if (!s) return '';
  let m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (m) return `${m[1]}-${m[2]}-${m[3]}`;
  m = s.match(/^(\d{1,2})[.\/-](\d{1,2})[.\/-](\d{2,4})/);
  if (m){ let y=+m[3]; if(y<100) y+=2000; return `${y}-${pad(+m[2])}-${pad(+m[1])}`; }
  return s.slice(0,10);
}
function byId(id){ return S.hearings.find(h=>h.id===String(id)); }
function sortChrono(a,b){
  return (a.date+a.time).localeCompare(b.date+b.time) || a.court.localeCompare(b.court,'tr');
}

function loadAll(){
  S.settings = {...DEFAULT_SETTINGS, ...(lsGet(K.settings,{})||{})};
  S.settings.adliTatil = {...DEFAULT_SETTINGS.adliTatil, ...(S.settings.adliTatil||{})};
  S.seg = S.settings.lastSegment || 'today';

  let raw = lsGet(K.data,null);

  // v8 ve öncesi anahtarından tek seferlik göç
  if (!raw) {
    const legacy = lsGet(K.legacyData,null);
    if (Array.isArray(legacy) && legacy.length) {
      raw = legacy;
      console.info('[turta] v7/v8 verisi taşındı:', legacy.length);
    }
  }
  // HTML'e gömülü veri (arşiv dosyası açıldığında)
  if (!raw && Array.isArray(EMBEDDED_DATA) && EMBEDDED_DATA.length) raw = EMBEDDED_DATA;

  S.hearings = Array.isArray(raw) ? raw.map(normalize) : [];
  S.undo = lsGet(K.undo,[]) || [];
}

/** localStorage boş/bozuksa IndexedDB aynasından kurtar. */
async function recoverIfEmpty(){
  if (S.hearings.length) return;
  try {
    const cur = await idbGet('kv','current');
    if (cur && Array.isArray(cur.v) && cur.v.length) {
      S.hearings = cur.v.map(normalize);
      persist({undoable:false, silent:true});
      toast(`💽 Kalıcı yedekten ${S.hearings.length} kayıt geri yüklendi`, 5000);
      renderAll();
    }
  } catch(e){ /* IDB yoksa sorun değil */ }
}

function persist(opt={}){
  const ok = lsSet(K.data, S.hearings);
  if (ok !== S.storageOk) { S.storageOk = ok; renderBanners(); }
  if (!ok && !opt.silent) {
    toast('⚠️ Cihaz depolaması yazılamadı! Hemen yedek alın.', 8000);
  }
  // Kalıcı ayna (asenkron, hata yutulur)
  idbPut('kv',{k:'current', v:S.hearings, ts:Date.now()}).catch(()=>{});
  idbPut('snaps',{d:todayISO(), v:S.hearings, ts:Date.now()})
    .then(pruneSnaps).catch(()=>{});
}
async function pruneSnaps(){
  try {
    const all = await idbAll('snaps');
    if (all.length<=14) return;
    all.sort((a,b)=>a.d.localeCompare(b.d));
    for (const s of all.slice(0, all.length-14)) await idbDel('snaps', s.d);
  } catch(e){}
}
function saveSettings(){ lsSet(K.settings, S.settings); }

// ── Geri alma (ters işlem tabanlı — anlık görüntü değil) ──
function pushUndo(op){
  S.undo.push(op);
  if (S.undo.length>40) S.undo.shift();
  lsSet(K.undo, S.undo);
  // Yedeksiz biriken değişiklikleri say
  S.settings.changesSinceBackup = (S.settings.changesSinceBackup||0) + 1;
  saveSettings();
}
function doUndo(){
  const op = S.undo.pop();
  if (!op) { toast('Geri alınacak işlem yok'); return; }
  lsSet(K.undo, S.undo);
  (op.dels||[]).forEach(id => { S.hearings = S.hearings.filter(h=>h.id!==id); });
  (op.puts||[]).forEach(rec => {
    const i = S.hearings.findIndex(h=>h.id===rec.id);
    if (i>=0) S.hearings[i]=rec; else S.hearings.push(rec);
  });
  persist(); renderAll();
  toast('↩️ Geri alındı: '+(op.label||'işlem'));
}

// ── Mutasyonlar ──
function addHearing(data){
  const rec = normalize({...data, id:uid(), createdAt:Date.now(), updatedAt:Date.now()});
  S.hearings.push(rec);
  pushUndo({label:'ekleme', dels:[rec.id], puts:[]});
  persist(); renderAll();
  return rec;
}
function updateHearing(id, data){
  const i = S.hearings.findIndex(h=>h.id===String(id));
  if (i<0) return null;
  const before = {...S.hearings[i]};
  S.hearings[i] = normalize({...before, ...data, id:before.id, createdAt:before.createdAt, updatedAt:Date.now()});
  pushUndo({label:'düzenleme', puts:[before], dels:[]});
  persist(); renderAll();
  return S.hearings[i];
}
function removeHearing(id){
  const rec = byId(id); if (!rec) return;
  S.hearings = S.hearings.filter(h=>h.id!==rec.id);
  pushUndo({label:'silme', puts:[rec], dels:[]});
  persist(); renderAll();
  toastUndo('🗑️ Silindi');
}
function setStatus(id, st){
  const rec = byId(id); if (!rec || rec.status===st) return;
  const before = {...rec};
  rec.status = st; rec.updatedAt = Date.now();
  pushUndo({label:'durum', puts:[before], dels:[]});
  persist(); renderAll(); buzz();
  toastUndo(STATUS[st].emoji+' '+STATUS[st].label);
}
/** Erteleme: eskisi tarihçede kalır, yenisi zincire eklenir. */
function postpone(id, {date, time, note}){
  const old = byId(id); if (!old) return null;
  const before = {...old};
  old.status='postponed'; old.updatedAt=Date.now();
  const rec = normalize({
    id:uid(), date, time, court:old.court, file:old.file, client:old.client,
    type:old.type, status:'active', note:note||'', prevId:old.id,
    createdAt:Date.now(), updatedAt:Date.now()
  });
  S.hearings.push(rec);
  pushUndo({label:'erteleme', puts:[before], dels:[rec.id]});
  persist(); renderAll();
  return rec;
}

// ═══════════════ 3. ÖNERİ MOTORU ═══════════════
/** Mahkeme adlarını sıklık + tazelikle sıralar. */
function courtIndex(){
  const m = new Map();
  S.hearings.forEach(h=>{
    if (!h.court) return;
    const k = h.court;
    const e = m.get(k) || {court:k, n:0, last:'', type:h.type, files:new Set()};
    e.n++; if (h.date>e.last){ e.last=h.date; e.type=h.type; }
    if (h.file) e.files.add(h.file);
    m.set(k,e);
  });
  const today = todayISO();
  return [...m.values()].map(e=>{
    const age = Math.abs(dayDiff(today, e.last||today));
    return {...e, score: e.n * (1 + 2/(1 + age/120))};
  }).sort((a,b)=>b.score-a.score);
}
function fileIndex(){
  const m = new Map();
  S.hearings.forEach(h=>{
    if (!h.file) return;
    const e = m.get(h.file) || {file:h.file, n:0, last:'', court:h.court, type:h.type, client:h.client};
    e.n++;
    if (h.date>e.last){ e.last=h.date; e.court=h.court; e.type=h.type; if(h.client) e.client=h.client; }
    m.set(h.file,e);
  });
  return [...m.values()].sort((a,b)=>b.last.localeCompare(a.last));
}

// ═══════════════ 4. AKILLI METİN AYRIŞTIRMA ═══════════════
/**
 * UYAP / e-Devlet / serbest metinden tarih, saat, esas no, mahkeme çıkarır.
 * Hata toleranslıdır: bulduğunu doldurur, kalanı kullanıcıya bırakır.
 */
function smartParse(text){
  const out = {};
  let s = ' ' + String(text||'').replace(/\s+/g,' ') + ' ';
  const Y = new Date().getFullYear();

  // ── 1. Esas no önce: "2025/123", "2025/123 E.", "E. 2025/123"
  const fm = s.match(/\b(19|20)(\d{2})\s*\/\s*(\d{1,6})\b/);
  if (fm) {
    const yy = fm[1]+fm[2], no = fm[3];
    const after = s.slice(s.indexOf(fm[0]) + fm[0].length, s.indexOf(fm[0]) + fm[0].length + 12);
    const isEsas = /^\s*(e\.?|esas)/i.test(after) || /esas\s*(no)?\s*:?\s*$/i.test(s.slice(0, s.indexOf(fm[0])).slice(-14));
    out.file = `${yy}/${no}` + (isEsas ? ' E.' : '');
    s = s.replace(fm[0], ' ');    // tarih aramasında karışmasın
  }

  // ── 2. Tarih
  let dm;
  if ((dm = s.match(/\b(\d{4})-(\d{2})-(\d{2})\b/))) {
    out.date = `${dm[1]}-${dm[2]}-${dm[3]}`;
    s = s.replace(dm[0],' ');
  } else if ((dm = s.match(/\b(\d{1,2})\s*[.\/-]\s*(\d{1,2})\s*[.\/-]\s*(\d{2,4})\b/))) {
    let yy = +dm[3]; if (yy<100) yy += 2000;
    out.date = `${yy}-${pad(+dm[2])}-${pad(+dm[1])}`;
    s = s.replace(dm[0],' ');
  } else {
    const mn = MONTHS.map(m=>fold(m)).join('|');
    const re = new RegExp('\\b(\\d{1,2})\\s+(' + mn + ')\\w*\\s*(\\d{4})?','i');
    const fs = fold(s);
    const mm = fs.match(re);
    if (mm) {
      const mi = MONTHS.findIndex(m=>fold(m)===mm[2]);
      const yy = mm[3] ? +mm[3] : Y;
      if (mi>=0) out.date = `${yy}-${pad(mi+1)}-${pad(+mm[1])}`;
    } else if ((dm = s.match(/\b(\d{1,2})\s*[.\/]\s*(\d{1,2})\b(?!\s*[.\/:]\s*\d)/))) {
      // "15.10" → yıl: bu yıl, geçmişse gelecek yıl
      let iso = `${Y}-${pad(+dm[2])}-${pad(+dm[1])}`;
      if (dayDiff(iso, todayISO()) < -30) iso = `${Y+1}-${pad(+dm[2])}-${pad(+dm[1])}`;
      out.date = iso;
      s = s.replace(dm[0],' ');
    }
  }
  if (out.date && !/^\d{4}-\d{2}-\d{2}$/.test(out.date)) delete out.date;

  // ── 3. Saat: "saat 10:30", "10:30", "10.30"
  let tm = s.match(/\bsaat\s*:?\s*(\d{1,2})[:.](\d{2})/i) || s.match(/\b([01]?\d|2[0-3])[:.]([0-5]\d)\b/);
  if (tm) out.time = pad(+tm[1])+':'+pad(+tm[2]);

  // ── 4. Mahkeme: mahkeme sözcüğü geçen en uzun parça
  const COURT_RE = /(mahkeme|hakimlik|hakimligi|hâkimliği|daire|sulh|asliye|agir ceza|ağır ceza|icra|aile|is mahkeme|iş mahkeme|ticaret|tuketici|tüketici|kadastro|vergi|idare|bolge adliye|bölge adliye|cumhuriyet bassavcilig|savcilik|noter|hakem heyeti)/i;
  const parts = String(text||'')
    .split(/[\n\r]|(?:\s+[-–—|]\s+)|·/g)
    .map(x=>x.trim()).filter(Boolean);
  let best = '';
  for (const p of parts) {
    if (!COURT_RE.test(fold(p))) continue;
    let c = p
      .replace(/\b(19|20)\d{2}\s*\/\s*\d{1,6}\b\s*(e\.?|esas\s*no\s*:?)?/ig,'')
      .replace(/\b\d{1,2}[.\/-]\d{1,2}[.\/-]\d{2,4}\b/g,'')
      // "18 Kasım 2026" gibi yazıyla tarih ve "Perşembe" gibi gün adı
      .replace(new RegExp('\\b\\d{1,2}\\s+(' + MONTHS.join('|') + ')\\w*(\\s+\\d{4})?','ig'),'')
      .replace(new RegExp('\\b(' + DAYS_L.join('|') + ')\\b','ig'),'')
      .replace(/\b\d{1,2}[:.]\d{2}\b/g,'')
      .replace(/^\s*(mahkeme|mahkemesi|duru[sş]ma|dosya|saat|tarih)\s*:?\s*/i,'')
      .replace(/\s{2,}/g,' ').replace(/^[\s:;,.\-–—]+|[\s:;,.\-–—]+$/g,'').trim();
    if (c.length>best.length) best = c;
  }
  if (best) out.court = best;

  // ── 5. Konum ipuçları
  const f = fold(text||'');
  if (/tevkil|sehir disi|başka il|baska il/.test(f)) out.type='tev';
  else if (/ek bina|ek hizmet/.test(f)) out.type='ek';

  return out;
}

// ═══════════════ 5. ARAMA / FİLTRELEME ═══════════════
function searchMatch(h, q){
  if (!q) return true;
  const hay = fold([h.court,h.file,h.client,h.note,TYPES[h.type].label,
                    STATUS[h.status].label, fmtNum(h.date), fmtLong(h.date), h.time].join(' '));
  return fold(q).split(/\s+/).filter(Boolean).every(t=>hay.includes(t));
}

function segmentItems(){
  const t = todayISO();
  const q = S.q.trim();
  let items = S.hearings.slice();

  if (q) return items.filter(h=>searchMatch(h,q)).sort(sortChrono);

  switch (S.seg) {
    case 'today':
      return items.filter(h=>h.date===t || h.date===addDays(t,1)).sort(sortChrono);
    case 'week': {
      const end = addDays(t,7);
      return items.filter(h=>h.date>=t && h.date<=end).sort(sortChrono);
    }
    case 'upcoming':
      return items.filter(h=>h.date>=t && h.status==='active').sort(sortChrono);
    case 'calendar': {
      if (S.calSel) return items.filter(h=>h.date===S.calSel).sort(sortChrono);
      const mp = `${S.calY}-${pad(S.calM+1)}`;
      return items.filter(h=>h.date.startsWith(mp)).sort(sortChrono);
    }
    case 'all':
    default: {
      if (S.filter!=='all') items = items.filter(h=>h.status===S.filter);
      return items.sort(sortChrono);
    }
  }
}

function listHTML(items){
  const t = todayISO();
  let html='', lastDate=null;
  for (const h of items) {
    if (h.date !== lastDate) {
      lastDate = h.date;
      const n = items.filter(x=>x.date===h.date).length;
      const flags = dayFlags(h.date);
      const diff = dayDiff(h.date, t);
      let sub;
      if (diff===0) sub='Bugün'; else if (diff===1) sub='Yarın'; else if (diff===-1) sub='Dün';
      else sub = DAYS_L[parseD(h.date).getDay()] + (diff>1?` · ${diff} gün sonra`:'');
      const d = parseD(h.date);
      html += `<div class="daysep${diff===0?' is-today':''}${flags.length?' is-off':''}" id="d-${esc(h.date)}">
        <span class="daysep-main num">${d.getDate()} ${MONTHS[d.getMonth()]}</span>
        <span class="daysep-sub">${esc(sub)}${flags.length?' · '+esc(flags[0].t):''}</span>
        <span class="daysep-count">${n}</span>
      </div>`;
    }
    html += rowHTML(h);
  }
  return html;
}

/** 14 günlük yoğunluk şeridi — haftayı tek bakışta gör. */
function stripHTML(){
  const t = todayISO();
  let out='';
  for (let i=0;i<14;i++){
    const iso = addDays(t,i);
    const day = S.hearings.filter(h=>h.date===iso && h.status!=='decided');
    const types = [...new Set(day.map(h=>h.type))].slice(0,4);
    const d = parseD(iso);
    const cls = ['sd'];
    if (i===0) cls.push('today');
    if (isOffDay(iso)) cls.push('off');
    if (!day.length) cls.push('empty0');
    out += `<button class="${cls.join(' ')}" data-act="strip:day" data-d="${iso}">
      <span class="sd-w">${DAYS_S[d.getDay()]}</span>
      <span class="sd-n">${d.getDate()}</span>
      <span class="sd-dots">${types.map(x=>`<i class="cdot ${x}"></i>`).join('')}</span>
    </button>`;
  }
  return `<div class="strip">${out}</div>`;
}

function renderCalendar(){
  const w = $('#calwrap');
  const y=S.calY, m=S.calM;
  const first = new Date(y,m,1).getDay();
  const lead = (first===0?6:first-1);
  const days = new Date(y,m+1,0).getDate();
  const prevDays = new Date(y,m,0).getDate();
  const t = todayISO();

  let cells='';
  for (let i=lead; i>0; i--) cells += `<div class="cell mute">${prevDays-i+1}</div>`;
  for (let d=1; d<=days; d++){
    const iso = `${y}-${pad(m+1)}-${pad(d)}`;
    const dayH = S.hearings.filter(h=>h.date===iso);
    const types = [...new Set(dayH.map(h=>h.type))].slice(0,4);
    const cls = ['cell'];
    if (iso===t) cls.push('today');
    if (iso===S.calSel) cls.push('on');
    if (isOffDay(iso)) cls.push('off');
    cells += `<div class="${cls.join(' ')}" data-act="cal:day" data-d="${iso}">
      <span class="num">${d}</span>
      <span class="cdots">${types.map(x=>`<i class="cdot ${x}"></i>`).join('')}</span>
    </div>`;
  }
  const tail = (7 - ((lead+days)%7)) % 7;
  for (let i=1;i<=tail;i++) cells += `<div class="cell mute">${i}</div>`;

  w.innerHTML = `<div class="calwrap">
    <div class="calnav">
      <button class="calnav-btn" data-act="cal:prev" aria-label="Önceki ay">‹</button>
      <div class="calnav-title">${MONTHS[m]} ${y}</div>

    <div class="grid" id="calgrid">${cells}</div>

function renderFiles(){
  const el = $('#files');
  const q = S.qf.trim();
  const groups = new Map();
  S.hearings.forEach(h=>{
    const key = h.file || '(dosya no yok)';
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(h);
  });
  let list = [...groups.entries()];
  if (q) list = list.filter(([k,arr]) =>
    fold(k).includes(fold(q)) || arr.some(h=>searchMatch(h,q)));

  const t = todayISO();
  list.forEach(([,arr])=>arr.sort(sortChrono));
  list.sort((a,b)=>{
    const na = a[1].find(h=>h.date>=t && h.status==='active');
    const nb = b[1].find(h=>h.date>=t && h.status==='active');
    if (na && !nb) return -1;
    if (!na && nb) return 1;
    if (na && nb) return na.date.localeCompare(nb.date);
    return b[1][b[1].length-1].date.localeCompare(a[1][a[1].length-1].date);
  });

  if (!list.length) {
    el.innerHTML = `<div class="empty"><div class="empty-ico">📭</div>
      <div class="empty-t">${q?'Sonuç yok':'Dosya yok'}</div></div>`;
    return;
  }

  el.innerHTML = list.map(([file, arr])=>{
    const next = arr.find(h=>h.date>=t && h.status==='active');
    const last = arr[arr.length-1];
    const courts = [...new Set(arr.map(h=>h.court).filter(Boolean))];
    const client = (arr.find(h=>h.client)||{}).client || '';
    const stCls = next ? 'active' : (arr.some(h=>h.status==='decided') ? 'decided' : 'done');
    return `<div class="fgroup">
      <button class="fg-head" data-act="file:open" data-f="${esc(file)}">
        <div class="fg-main sel">
          <div class="fg-no num">📁 ${esc(file)}</div>
          <div class="fg-sub">${esc(courts[0]||'—')}${courts.length>1?` +${courts.length-1}`:''}${client?` · 👤 ${esc(client)}`:''}</div>
          <div class="fg-sub">${arr.length} duruşma · son: ${esc(fmtNum(last.date))}</div>
        </div>
        <div class="fg-right">
          ${next?`<div class="fg-next"><b class="num">${esc(fmtShort(next.date))}</b>${esc(next.time)}</div>`:''}
          <span class="stdot ${stCls}"></span>
        </div>
      </button>
    </div>`;
  }).join('');
}

function findConflicts(){
  const t = todayISO();
  const a = S.hearings.filter(h=>h.type!=='tev' && h.status==='active' && h.date>=t).sort(sortChrono);
  const out=[];
  for (let i=0;i<a.length;i++) for (let j=i+1;j<a.length;j++){
    if (a[i].date!==a[j].date) break;
    const gap = Math.abs(mins(a[i].time)-mins(a[j].time));
    const cross = a[i].type!==a[j].type;
    if (gap < (cross?GAP_CROSS:GAP_SAME)) out.push({a:a[i], b:a[j], gap, cross});
  }
  // Bina değişikliği olanlar önce
  return out.sort((x,y)=>(y.cross-x.cross)||(x.gap-y.gap));
}
function busyDays(){
  const t = todayISO(); const m={};
  S.hearings.forEach(h=>{ if(h.date>=t && h.status==='active') m[h.date]=(m[h.date]||0)+1; });
  return Object.entries(m).filter(([,n])=>n>=2).sort((x,y)=>y[1]-x[1]||x[0].localeCompare(y[0])).slice(0,6);
}

// ═══════════════ 7. SHEET ═══════════════
let sheetCleanup = null;
function openSheet(html, onMount){
  const host=$('#sheet-host'), sh=$('#sheet');
  sh.innerHTML = `<div class="sheet-grip"></div>` + html;
  host.hidden = false;
  document.body.style.overflow='hidden';
  if (sheetCleanup) { try{sheetCleanup();}catch(e){} }
  sheetCleanup = (onMount && onMount(sh)) || null;
  sh.scrollTop = 0;
}
function closeSheet(){
  $('#sheet-host').hidden = true;
  $('#sheet').innerHTML = '';
  document.body.style.overflow='';
  if (sheetCleanup) { try{sheetCleanup();}catch(e){} sheetCleanup=null; }
}
function sheetHead(title, sub){
  return `<div class="sheet-head">
    <div style="flex:1;min-width:0"><div class="sheet-title">${esc(title)}</div>
    ${sub?`<div class="sheet-sub">${esc(sub)}</div>`:''}</div>
    <button class="sheet-x" data-act="sheet:close" aria-label="Kapat">✕</button>
  </div>`;
}

function confirmSheet({title, body, ok='Evet', danger=false}){
  return new Promise(res=>{
    openSheet(
      sheetHead(title) +
      `<div class="sheet-body"><div style="font-size:14px;line-height:1.6;padding-bottom:8px">${body}</div></div>
       <div class="sheet-foot">
         <button class="btn ${danger?'btn-dg':'btn-p'}" id="cf-ok">${esc(ok)}</button>
         <button class="btn btn-2" id="cf-no">Vazgeç</button>
       </div>`,
      sh=>{
        sh.querySelector('#cf-ok').onclick = ()=>{ closeSheet(); res(true); };
        sh.querySelector('#cf-no').onclick = ()=>{ closeSheet(); res(false); };
        return ()=>res(false);
      });
  });
}

/** Aynı dosya numarasına ait duruşmaları kronolojik verir. */
function chainOf(h){
  if (!h.file) return [h];
  return S.hearings.filter(x=>x.file===h.file).sort(sortChrono);
}

// ── Dosya detayı ──
function openFile(file){
  const arr = S.hearings.filter(h=>(h.file||'(dosya no yok)')===file).sort(sortChrono);
  if (!arr.length) return;
  const t = todayISO();
  const next = arr.find(h=>h.date>=t && h.status==='active');
  const courts = [...new Set(arr.map(h=>h.court).filter(Boolean))];
  const client = (arr.find(h=>h.client)||{}).client || '';
  const link = (S.settings.fileLinks||{})[file] || '';

  openSheet(
    sheetHead('📁 '+file, `${arr.length} duruşma${client?' · '+client:''}`) +
    `<div class="sheet-body sel">
      ${next?`<div class="hint info">📅 Sıradaki: <b>${esc(fmtLong(next.date))}</b> · ${esc(next.time)}</div>`
            :`<div class="hint ok">✅ Bekleyen aktif duruşma yok</div>`}
      <div class="acts">
        ${next?`<button class="act" data-act="postpone" data-id="${esc(next.id)}"><i>⏸️</i>Ertele</button>`
              :`<button class="act" data-act="new:file" data-f="${esc(file)}"><i>＋</i>Yeni gün</button>`}
        <button class="act" data-act="copy:file" data-f="${esc(file)}"><i>📋</i>Esas No</button>
        ${link ? `<button class="act" data-act="link:open" data-u="${esc(link)}"><i>📂</i>Klasör</button>`

      </div>
      <div class="dv"><div class="dv-k">Mahkeme</div><div class="dv-v">${courts.map(esc).join('<br>')||'—'}</div></div>
      ${client?`<div class="dv"><div class="dv-k">Müvekkil</div><div class="dv-v">${esc(client)}</div></div>`:''}

      <div class="tl">${arr.map(c=>`<div class="tl-i ${c.status}">

function mountForm(sh, edit, orig){
  const g = s => sh.querySelector(s);
  const state = { type: edit?orig.type:(sh.querySelector('#f-type .pick.on')||{dataset:{}}).dataset.t || 'ana',
                  status: edit?orig.status:'active' };

  // Konum
  g('#f-type').addEventListener('click', e=>{
    const b=e.target.closest('.pick'); if(!b) return;
    state.type=b.dataset.t;
    g('#f-type').querySelectorAll('.pick').forEach(x=>x.classList.toggle('on',x===b));
    refreshFlags();
  });
  // Durum
  if (g('#f-status')) g('#f-status').addEventListener('click', e=>{
    const b=e.target.closest('.pick'); if(!b) return;
    state.status=b.dataset.s;
    g('#f-status').querySelectorAll('.pick').forEach(x=>x.classList.toggle('on',x===b));
  });
  // Hızlı tarih
  g('#f-dq').addEventListener('click', e=>{
    const b=e.target.closest('.pick'); if(!b) return;
    const t=todayISO();

          g('#f-type').querySelectorAll('.pick').forEach(x=>x.classList.toggle('on',x.dataset.t===p.type)); }

          ? `<div class="hint ok" style="margin-top:8px">✓ Bulundu: ${got.join(', ')} — aşağıdan kontrol edin</div>`
          : `<div class="hint warn" style="margin-top:8px">Tanınan bilgi yok; alanları elle doldurun</div>`;
        refreshFlags();
      }, 260);
    });
  }

  // Otomatik tamamlama — mahkeme
  wireAC(g('#f-court'), g('#ac-court'), q=>{
    const idx = courtIndex();
    const hit = q ? idx.filter(c=>fold(c.court).includes(fold(q))) : idx;
    return hit.slice(0,8).map(c=>({
      main:c.court,
      sub:`${c.n} duruşma${c.files.size?' · '+[...c.files].slice(0,2).join(', '):''}`,
      apply:()=>{ g('#f-court').value=c.court;
        if(!edit){ state.type=c.type;
          g('#f-type').querySelectorAll('.pick').forEach(x=>x.classList.toggle('on',x.dataset.t===c.type)); }
        refreshFlags(); }
    }));
  });
  // Otomatik tamamlama — dosya no (seçince mahkeme + müvekkil dolar)
  wireAC(g('#f-file'), g('#ac-file'), q=>{
    const idx = fileIndex();
    const hit = q ? idx.filter(c=>fold(c.file).includes(fold(q))) : idx;
    return hit.slice(0,8).map(c=>({
      main:c.file,
      sub:`${c.court}${c.client?' · '+c.client:''} · ${c.n} duruşma`,
      apply:()=>{
        g('#f-file').value=c.file;
        if(!g('#f-court').value) g('#f-court').value=c.court;
        if(!g('#f-client').value && c.client) g('#f-client').value=c.client;
        state.type=c.type;
        g('#f-type').querySelectorAll('.pick').forEach(x=>x.classList.toggle('on',x.dataset.t===c.type));
        refreshFlags();
      }
    }));
  });

  function refreshFlags(){
    const date=g('#f-date').value, time=g('#f-time').value;
    // Gün uyarıları
    const fl = date?dayFlags(date):[];
    g('#f-dayflags').innerHTML = fl.length
      ? `<div class="hint warn" style="margin-top:8px">⚠️ ${fl.map(f=>esc(f.t)).join(' · ')}
           <button data-fix="1">İş gününe al</button></div>` : '';
    const fix = g('#f-dayflags').querySelector('[data-fix]');
    if (fix) fix.onclick = ()=>{ g('#f-date').value = nextWorkday(date); refreshFlags(); };
    // Çakışma
    g('#f-conflict').innerHTML = conflictHTML(conflictFor(date, time, state.type, edit?orig.id:null));
  }
  refreshFlags();

  function collect(){
    return {
      date:g('#f-date').value, time:g('#f-time').value,
      court:g('#f-court').value.trim(), file:g('#f-file').value.trim(),
      client:g('#f-client').value.trim(), note:g('#f-note').value.trim(),
      type:state.type, status:state.status
    };
  }
  function validate(d){
    if (!d.date){ toast('⚠️ Tarih gerekli'); return false; }
    if (!d.court && !d.file){ toast('⚠️ Mahkeme veya dosya no gerekli'); return false; }
    return true;
  }

  g('#f-save').onclick = ()=>{
    const d=collect(); if(!validate(d)) return;
    if (edit) { updateHearing(orig.id,d); toast('✅ Güncellendi'); }
    else      { addHearing(d); toast('✅ Eklendi'); }
    closeSheet();
  };
  if (g('#f-save2')) g('#f-save2').onclick = ()=>{
    const d=collect(); if(!validate(d)) return;
    addHearing(d);
    toast('✅ Eklendi — sıradaki');
    // Mahkeme/konum/tarih kalsın, dosya-müvekkil-not temizlensin
    g('#f-file').value=''; g('#f-client').value=''; g('#f-note').value='';
    if (smart) { smart.value=''; g('#f-smart-out').innerHTML=''; }
    g('#f-file').focus();
    refreshFlags();
  };

  return null;
}

/* Aynı binada 60 dk yeterli; bina değiştirmek yol demek — 90 dk aranır. */
const GAP_SAME  = 60;
const GAP_CROSS = 90;
function mins(t){ return +String(t).slice(0,2)*60 + +String(t).slice(3,5); }

/** En yakın çakışmayı {h, gap, cross} olarak döndürür. */
function conflictFor(date, time, type, skipId){
  if (!date || !time || type==='tev') return null;
  const m = mins(time);
  let best = null;
  for (const h of S.hearings){
    if (h.id===skipId || h.date!==date || h.type==='tev' || h.status!=='active') continue;
    const gap = Math.abs(mins(h.time)-m);
    const cross = h.type!==type;
    if (gap < (cross?GAP_CROSS:GAP_SAME) && (!best || gap<best.gap)) best={h,gap,cross};
  }
  return best;
}
function conflictHTML(cf){
  if (!cf) return '';
  const {h,gap,cross} = cf;
  return cross
    ? `<div class="hint bad">🚨 <b>Bina değişikliği:</b> ${esc(h.time)} ${esc(TYPES[h.type].short)} —
         ${esc(h.court)}. Arada yalnızca <b>${gap} dk</b> var; yetişmek zor.</div>`
    : `<div class="hint bad">⚠️ ${esc(h.time)} — ${esc(h.court)} ile çakışıyor (${gap} dk arayla)</div>`;
}

/** Basit otomatik tamamlama bağlayıcı. */
function wireAC(input, box, getItems){
  if (!input || !box) return;
  let items=[];
  const render = ()=>{
    items = getItems(input.value.trim());
    if (!items.length){ box.hidden=true; return; }
    box.innerHTML = items.map((it,i)=>
      `<div class="ac-item" data-i="${i}">${esc(it.main)}<small>${esc(it.sub||'')}</small></div>`).join('');
    box.hidden=false;
  };
  input.addEventListener('focus', render);
  input.addEventListener('input', render);
  input.addEventListener('blur', ()=>setTimeout(()=>{box.hidden=true;},180));
  box.addEventListener('mousedown', e=>{
    const el=e.target.closest('.ac-item'); if(!el) return;
    e.preventDefault();
    const it=items[+el.dataset.i]; if(it) it.apply();
    box.hidden=true;
  });
  box.addEventListener('touchstart', e=>{
    const el=e.target.closest('.ac-item'); if(!el) return;
    const it=items[+el.dataset.i]; if(it) it.apply();
    box.hidden=true;
  }, {passive:true});
}

function hearingText(h){

async function shareText(title, text){
  try {
    if (navigator.share) { await navigator.share({title, text}); return; }
  } catch(e){ if (e && e.name==='AbortError') return; }
  try { await navigator.clipboard.writeText(text); toast('📋 Panoya kopyalandı'); }
  catch(e){
    const ta=document.createElement('textarea');
    ta.value=text; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); toast('📋 Panoya kopyalandı'); }
    catch(_){ toast('Kopyalanamadı'); }
    document.body.removeChild(ta);
  }
}
function shareRange(fromISO, toISO_, title){
  const list = S.hearings
    .filter(h=>h.date>=fromISO && h.date<=toISO_ && h.status!=='decided')
    .sort(sortChrono);
  if (!list.length) { toast('Bu aralıkta duruşma yok'); return; }
  let out = `⚖️ Av. Fuat DOBLAN — ${title}\n`;
  let last=null;
  list.forEach(h=>{
    if (h.date!==last){ last=h.date; out += `\n── ${fmtLong(h.date)} ──\n`; }
    out += `${h.time}  ${h.court}${h.file?'  ('+h.file+')':''}\n`;
  });
  shareText(title, out.trim());
}

function download(name, mime, content){
  const blob = new Blob([content], {type:mime});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href=url; a.download=name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 4000);
}

/* ── Yedek zamanlaması ──
   Tarayıcıdaki hiçbir depolama "site verilerini temizle"den kurtulmaz.
   Tek gerçek koruma, tarayıcının DIŞINDA duran bir dosyadır. Bu yüzden
   uyarı kolay görmezden gelinemeyecek kadar ısrarcı.                       */
function backupDue(){
  if (!S.hearings.length) return null;
  const st = S.settings;
  if (!st.lastBackupDate) return {kind:'never'};
  const gap = dayDiff(todayISO(), st.lastBackupDate);
  if (gap >= (st.backupEveryDays||7)) return {kind:'days', n:gap};
  if ((st.changesSinceBackup||0) >= 20) return {kind:'changes', n:st.changesSinceBackup};
  return null;
}
/** Açılışta panel çıkarılsın mı — "yarın hatırlat" buna işler, şeride işlemez. */

  const d = backupDue();
  if (!d) return null;
  const sn = S.settings.backupSnoozeUntil;
  if (sn && sn > todayISO()) return null;

}

// ── ICS ──
function icsEsc(s){
  return String(s==null?'':s)
    .replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,')
    .replace(/\r?\n/g,'\\n');
}
function icsFold(line){
  if (line.length<=73) return line;
  let out=line.slice(0,73), rest=line.slice(73);
  while (rest.length>72){ out += '\r\n ' + rest.slice(0,72); rest=rest.slice(72); }
  return out + (rest?'\r\n '+rest:'');
}
function icsStamp(d){
  return d.getUTCFullYear()+pad(d.getUTCMonth()+1)+pad(d.getUTCDate())+'T'
       + pad(d.getUTCHours())+pad(d.getUTCMinutes())+pad(d.getUTCSeconds())+'Z';
}
function buildICS(list){
  const L = [
    'BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Turta//Durusma Takip//TR',
    'CALSCALE:GREGORIAN','METHOD:PUBLISH','X-WR-CALNAME:Duruşmalar',
    'BEGIN:VTIMEZONE','TZID:Europe/Istanbul',
    'BEGIN:STANDARD','DTSTART:20161101T000000',
    'TZOFFSETFROM:+0300','TZOFFSETTO:+0300','TZNAME:+03',
    'END:STANDARD','END:VTIMEZONE'
  ];
  const stamp = icsStamp(new Date());
  const mins = +S.settings.reminderMin || 60;
  list.forEach(h=>{
    const d = parseD(h.date);
    const [hh,mm] = h.time.split(':').map(Number);
    const start = `${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}T${pad(hh)}${pad(mm)}00`;
    const e = new Date(d.getFullYear(), d.getMonth(), d.getDate(), hh, mm+60);
    const end = `${e.getFullYear()}${pad(e.getMonth()+1)}${pad(e.getDate())}T${pad(e.getHours())}${pad(e.getMinutes())}00`;
    const desc = [h.file?'Dosya: '+h.file:'', h.client?'Müvekkil: '+h.client:'',
                  'Konum: '+TYPES[h.type].label, h.note?'Not: '+h.note:''].filter(Boolean).join('\n');
    L.push('BEGIN:VEVENT');
    L.push('UID:'+h.id+'@turta');
    L.push('DTSTAMP:'+stamp);
    L.push('DTSTART;TZID=Europe/Istanbul:'+start);
    L.push('DTEND;TZID=Europe/Istanbul:'+end);
    L.push(icsFold('SUMMARY:'+icsEsc('Duruşma — '+(h.court||h.file))));
    L.push(icsFold('LOCATION:'+icsEsc(TYPES[h.type].label)));
    L.push(icsFold('DESCRIPTION:'+icsEsc(desc)));
    L.push('STATUS:'+(h.status==='active'?'CONFIRMED':'TENTATIVE'));
    L.push('BEGIN:VALARM','TRIGGER:-PT'+mins+'M','ACTION:DISPLAY',
           icsFold('DESCRIPTION:'+icsEsc('Duruşma: '+(h.court||h.file))),'END:VALARM');
    L.push('BEGIN:VALARM','TRIGGER:-P1D','ACTION:DISPLAY',
           icsFold('DESCRIPTION:'+icsEsc('Yarın duruşma: '+(h.court||h.file))),'END:VALARM');
    L.push('END:VEVENT');
  });
  L.push('END:VCALENDAR');
  return L.join('\r\n')+'\r\n';
}
function exportICS(list, name){
  if (!list.length){ toast('Aktarılacak duruşma yok'); return; }
  download(name, 'text/calendar;charset=utf-8', buildICS(list));
  toast('📆 İndirildi — dosyaya dokunup Takvim’e ekleyin', 5000);
}
/** Google Takvim'de "etkinlik ekle" ekranını doldurarak açar. */
function googleCalendar(h){
  const d = parseD(h.date);
  const [hh,mm] = h.time.split(':').map(Number);
  const s = new Date(d.getFullYear(), d.getMonth(), d.getDate(), hh, mm);
  const e = new Date(s.getTime()+60*60000);
  const f = x => x.toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,'');
  const p = new URLSearchParams({
    action:'TEMPLATE',
    text:'Duruşma — '+(h.court||h.file||''),
    dates:`${f(s)}/${f(e)}`,
    details:[h.file?'Dosya: '+h.file:'', h.client?'Müvekkil: '+h.client:'',
             h.note?'Not: '+h.note:''].filter(Boolean).join('\n'),
    location:TYPES[h.type].label
  });
  window.open('https://calendar.google.com/calendar/render?'+p.toString(), '_blank', 'noopener');
}

// ── İçe aktarma ──
function pickFile(){
  return new Promise(res=>{
    const inp = $('#filepick');
    inp.value='';
    const done = ()=>{ inp.removeEventListener('change',onCh); };
    const onCh = ()=>{
      done();
      const f = inp.files && inp.files[0];
      if (!f) return res(null);
      const r = new FileReader();
      r.onload = ()=>res(String(r.result||''));
      r.onerror= ()=>res(null);
      r.readAsText(f);
    };
    inp.addEventListener('change', onCh);
    inp.click();
  });
}
function parseBackup(text){
  let j;
  try { j = JSON.parse(text); } catch(e){ return null; }
  const arr = Array.isArray(j) ? j : (Array.isArray(j.hearings) ? j.hearings : null);
  if (!arr) return null;
  return arr.map(normalize);
}
async function doRestore(){
  const text = await pickFile(); if (text===null) return;
  const arr = parseBackup(text);
  if (!arr){ toast('❌ Dosya okunamadı veya biçim tanınmadı'); return; }
  const ok = await confirmSheet({
    title:'Geri Yükle',
    danger:true, ok:`${arr.length} kaydı yükle`,
    body:`Dosyada <b>${arr.length}</b> kayıt var.<br><br>
          Mevcut <b>${S.hearings.length}</b> kaydın <b>yerine</b> yazılacak.
          Eklemek istiyorsanız “Birleştirerek İçe Aktar”ı kullanın.`
  });
  if (!ok) return;
  const before = S.hearings.slice();
  S.hearings = arr;
  pushUndo({label:'geri yükleme', puts:before, dels:arr.map(h=>h.id)});
  persist(); renderAll();
  toast(`✅ ${arr.length} kayıt yüklendi`);
}
async function doMerge(){
  const text = await pickFile(); if (text===null) return;
  const arr = parseBackup(text);
  if (!arr){ toast('❌ Dosya okunamadı veya biçim tanınmadı'); return; }
  const keys = new Set(S.hearings.map(h=>`${h.date}|${h.time}|${fold(h.court)}|${fold(h.file)}`));
  const fresh = arr.filter(h=>!keys.has(`${h.date}|${h.time}|${fold(h.court)}|${fold(h.file)}`));
  if (!fresh.length){
    toast(`ℹ️ Yeni kayıt yok — ${arr.length} kaydın tamamı zaten var`, 5000);
    return;
  }
  const ok = await confirmSheet({
    title:'Birleştir', ok:`${fresh.length} kaydı ekle`,
    body:`Dosyada <b>${arr.length}</b> kayıt var.<br>
          • Yeni eklenecek: <b>${fresh.length}</b><br>
          • Zaten mevcut: <b>${arr.length-fresh.length}</b><br><br>
          Mevcut kayıtlarınıza dokunulmaz.`
  });
  if (!ok) return;
  fresh.forEach(h=>{ h.id = uid(); });
  S.hearings = S.hearings.concat(fresh);
  pushUndo({label:'birleştirme', dels:fresh.map(h=>h.id), puts:[]});
  persist(); renderAll();
  toast(`✅ ${fresh.length} kayıt eklendi`);
}

// ═══════════════ 9. BİLDİRİM (uygulama açıkken) ═══════════════
const notified = new Set();
function notifyTick(){
  if (!S.settings.notifications) return;
  if (!('Notification' in window) || Notification.permission!=='granted') return;
  const now = Date.now();
  S.hearings.forEach(h=>{
    if (h.status!=='active') return;
    const d=parseD(h.date), [hh,mm]=h.time.split(':').map(Number);
    const t = new Date(d.getFullYear(),d.getMonth(),d.getDate(),hh,mm).getTime();
    const diff = t-now;
    if (diff>0 && diff<=30*60000 && !notified.has(h.id)) {
      notified.add(h.id);
      try {
        new Notification('⚖️ '+(h.court||'Duruşma'), {
          body:`${Math.round(diff/60000)} dk sonra${h.file?' · '+h.file:''}`,
          icon:'icons/icon-192.png', tag:'turta-'+h.id
        });
      } catch(e){}
    }
  });
}
async function toggleNotifications(){
  if (!('Notification' in window)){ toast('Bu cihazda bildirim desteklenmiyor'); return; }
  if (Notification.permission==='denied'){
    toast('Tarayıcı ayarlarından bildirim izni vermeniz gerekiyor', 5000); return;
  }
  if (S.settings.notifications){ S.settings.notifications=false; saveSettings(); renderSettings(); return; }
  let p = Notification.permission;
  if (p==='default') p = await Notification.requestPermission();
  if (p==='granted'){
    S.settings.notifications=true; saveSettings();
    try{ new Notification('🔔 Hatırlatma açık',{body:'Uygulama açıkken duruşmadan 30 dk önce uyarır.',icon:'icons/icon-192.png'}); }catch(e){}
  }
  renderSettings();
}

// ═══════════════ 12. TEMA ═══════════════
let mqDark=null;
function applyTheme(t){
  const eff = (t==='auto')
    ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'night' : 'gold')
    : t;
  if (eff==='gold') document.body.removeAttribute('data-theme');
  else document.body.setAttribute('data-theme', eff);
  // Android durum çubuğu rengi temayla uyumlu olsun
  requestAnimationFrame(()=>{
    const c = getComputedStyle(document.body).getPropertyValue('--primary-dark').trim();
    const m = document.querySelector('meta[name="theme-color"]');
    if (m && c) m.setAttribute('content', c);
  });
}
function setTheme(t){
  S.settings.theme=t; saveSettings(); applyTheme(t);
  if (S.page==='settings') renderSettings();
  if (!mqDark && t==='auto'){
    mqDark = window.matchMedia('(prefers-color-scheme: dark)');
    const h = ()=>{ if (S.settings.theme==='auto') applyTheme('auto'); };
    mqDark.addEventListener ? mqDark.addEventListener('change',h) : mqDark.addListener(h);
  }
}

// ═══════════════ 13. KAYDIRMA HAREKETLERİ ═══════════════
function bindSwipe(container){
  container.querySelectorAll('.hrow').forEach(row=>{
    const card = row.querySelector('.hrow-in');
    const bg   = row.querySelector('.swipe-bg');
    const l = bg.querySelector('.sw-l'), r = bg.querySelector('.sw-r');
    let x0=0,y0=0,dx=0,horiz=null,active=false;

    card.addEventListener('touchstart', e=>{
      if (e.touches.length!==1) return;
      x0=e.touches[0].clientX; y0=e.touches[0].clientY;
      dx=0; horiz=null; active=true;
      card.style.transition='none';
    }, {passive:true});

    card.addEventListener('touchmove', e=>{
      if (!active) return;
      const cx=e.touches[0].clientX-x0, cy=e.touches[0].clientY-y0;
      if (horiz===null){
        if (Math.abs(cx)<8 && Math.abs(cy)<8) return;
        horiz = Math.abs(cx) > Math.abs(cy)*1.3;
        if (!horiz){ active=false; card.style.transition=''; card.style.transform=''; return; }
      }
      e.preventDefault();
      dx = cx;
      card.style.transform = `translateX(${dx}px)`;
      l.style.opacity = dx>0 ? Math.min(1,dx/80) : 0;
      r.style.opacity = dx<0 ? Math.min(1,-dx/80) : 0;
    }, {passive:false});

    const finish = ()=>{
      if (!active) return;
      active=false;
      card.style.transition='transform .22s ease';
      l.style.opacity=0; r.style.opacity=0;
      const id = row.dataset.id;
      if (dx > 90)      { card.style.transform=''; setStatus(id,'done'); }
      else if (dx < -90){ card.style.transform=''; openPostpone(id); }
      else card.style.transform='';
      dx=0;
    };
    card.addEventListener('touchend', finish, {passive:true});
    card.addEventListener('touchcancel', finish, {passive:true});
  });
}

function bindCalSwipe(){
  const g = $('#calgrid'); if (!g) return;
  let x0=0,y0=0,fired=false;
  g.addEventListener('touchstart', e=>{
    if (e.touches.length!==1) return;
    x0=e.touches[0].clientX; y0=e.touches[0].clientY; fired=false;
  }, {passive:true});
  g.addEventListener('touchmove', e=>{
    if (fired) return;
    const dx=e.touches[0].clientX-x0, dy=e.touches[0].clientY-y0;
    if (Math.abs(dx)>60 && Math.abs(dx)>Math.abs(dy)*1.6){
      fired=true; shiftMonth(dx<0?1:-1);
    }
  }, {passive:true});
}
function shiftMonth(n){
  let m=S.calM+n, y=S.calY;
  while(m<0){m+=12;y--;} while(m>11){m-=12;y++;}
  S.calM=m; S.calY=y; S.calSel=null;
  renderCalendar(); renderAgenda();
}

      ${opts.map(m=>`<button class="item" data-m="${m}" style="border-radius:10px;margin-bottom:6px;background:var(--bg)">
        <div class="item-main"><div class="item-l">${m>=1440?'1 gün':m+' dakika'} önce</div></div>

      </div>
      <button class="item" id="a-t" style="border-radius:10px;background:var(--bg);margin-top:10px">

/* ── Toplu yapıştırma ile içe aktarma ──
   UYAP listesi, Excel'den kopyalanmış satırlar, kâtipten gelen WhatsApp mesajı…
   Her satır ayrı ayrı çözümlenir, önizlenir, seçilenler eklenir.
   Bilgisayara / PowerShell'e gerek yok.                                        */
function bulkParse(text){
  const out=[];
  for (const line of String(text||'').split(/\r?\n/)) {
    const l = line.trim();
    if (l.length<6) continue;
    const p = smartParse(l);
    if (!p.date) continue;               // tarihsiz satır (başlık, boşluk) atlanır
    if (!p.court && !p.file) continue;   // tanımlayıcı yoksa atlanır
    out.push({date:p.date, time:p.time||'09:00', court:p.court||'',
              file:p.file||'', type:p.type||'ana', raw:l});
  }
  return out;
}
function openBulk(){
  openSheet(
    sheetHead('📋 Toplu Ekle', 'Yapıştır — her satır bir duruşma') +
    `<div class="sheet-body">
      <div class="hint info">Excel/UYAP listesinden satırları kopyalayıp buraya yapıştırın.
        Tarih içermeyen satırlar atlanır. Eklemeden önce hepsini görürsünüz.</div>
      <div class="fld">
        <textarea class="inp" id="b-in" rows="7" placeholder="15.10.2026 10:30 3. Asliye Hukuk Mahkemesi 2025/123 E.
22.10.2026 09:00 5. Aile Mahkemesi 2026/45 E.
…"></textarea>
      </div>
      <button class="btn btn-2 btn-sm" id="b-go">Çözümle</button>
      <div id="b-out" style="margin-top:12px"></div>
    </div>
    <div class="sheet-foot">
      <button class="btn btn-ok" id="b-save" disabled style="opacity:.5">Önce çözümleyin</button>
      <button class="btn btn-2" data-act="sheet:close">Vazgeç</button>
    </div>`,
  sh=>{
    const g=s=>sh.querySelector(s);
    let rows=[], keep=[];
    const dupKey = r => `${r.date}|${r.time}|${fold(r.court)}|${fold(r.file)}`;

    function analyse(){
      rows = bulkParse(g('#b-in').value);
      const have = new Set(S.hearings.map(dupKey));
      keep = rows.map((r,i)=>!have.has(dupKey(r)));
      const dupes = keep.filter(x=>!x).length;
      if (!rows.length){
        g('#b-out').innerHTML = `<div class="hint warn">Tanınan satır yok.
          Her satırda en az bir tarih ve bir mahkeme/dosya no bulunmalı.</div>`;
        g('#b-save').disabled=true; g('#b-save').style.opacity='.5';
        g('#b-save').textContent='Önce çözümleyin';
        return;
      }
      g('#b-out').innerHTML =
        `<div class="hint ok">${rows.length} satır çözümlendi${dupes?` · ${dupes} tanesi zaten kayıtlı (işaretsiz)`:''}</div>`
        + rows.map((r,i)=>`<label class="item" style="border-radius:10px;margin-bottom:6px;background:var(--bg);gap:10px">
            <input type="checkbox" data-i="${i}" ${keep[i]?'checked':''} style="width:22px;height:22px;flex-shrink:0">
            <div class="item-main">
              <div class="item-l num">${esc(fmtNum(r.date))} · ${esc(r.time)}</div>
              <div class="item-d">${esc(r.court||'(mahkeme yok)')}${r.file?' · '+esc(r.file):''}</div>
            </div></label>`).join('');
      sync();
    }
    function sync(){
      const n = keep.filter(Boolean).length;
      g('#b-save').disabled = !n;
      g('#b-save').style.opacity = n?'1':'.5';
      g('#b-save').textContent = n?`${n} kaydı ekle`:'Seçili kayıt yok';
    }
    g('#b-go').onclick = analyse;
    g('#b-out').addEventListener('change', e=>{
      const c=e.target.closest('input[type=checkbox]'); if(!c) return;
      keep[+c.dataset.i]=c.checked; sync();
    });
    g('#b-save').onclick = ()=>{
      const add = rows.filter((_,i)=>keep[i]);
      if (!add.length) return;
      const recs = add.map(r=>normalize({...r, id:uid(), status:'active',
                                         createdAt:Date.now(), updatedAt:Date.now()}));
      S.hearings = S.hearings.concat(recs);
      pushUndo({label:'toplu ekleme', dels:recs.map(r=>r.id), puts:[]});
      persist(); renderAll(); closeSheet(); buzz(25);
      toastUndo(`✅ ${recs.length} duruşma eklendi`);
    };
    return null;
  });
}

  });
